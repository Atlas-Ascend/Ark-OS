name: Atlas Android APK

on:
  push:
    branches:
      - integration/render-to-apk-atlas-assistant-001
      - integration/assistant-light-command-to-proof-apk-001
      - integration/full-ghost-atlas-tools-apk-002
    paths:
      - 'android/atlas-assistant/**'
      - '.github/workflows/atlas-android-apk.yml'
  pull_request:
    paths:
      - 'android/atlas-assistant/**'
      - '.github/workflows/atlas-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android/atlas-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prove live Ghost Atlas tool catalog and command-to-proof loop
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import uuid

          base = "https://ghost-atlas-runtime-gateway.onrender.com"
          with urllib.request.urlopen(base + "/v1/assistant/tools", timeout=30) as response:
              assert response.status == 200, response.status
              tools = json.loads(response.read().decode("utf-8"))

          ids = {item.get("capability_id") for item in tools.get("capabilities", [])}
          capability = "repository.custodian.observe"
          assert capability in ids, (capability, sorted(ids))

          correlation_id = str(uuid.uuid4())
          body = {
              "intent": "Inspect Atlas-Ascend/Ark-OS through the Ghost Atlas repository custodian and return proof",
              "correlation_id": correlation_id,
              "capability": capability,
              "payload": {"repository": "Atlas-Ascend/Ark-OS", "custodian_id": "ark-os-apk-ci"},
              "requested_by": "ark-os-apk-ci",
              "source_system": "ARK-OS/Atlas-Android-CI",
              "proof_required": True,
              "memory_return_required": True,
              "timeout_ms": 180000,
          }
          request = urllib.request.Request(
              base + "/v1/assistant/command-to-proof",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=200) as response:
              assert response.status == 200, response.status
              result = json.loads(response.read().decode("utf-8"))

          assert result.get("accepted") is True, result
          assert result.get("complete") is True, result
          assert result.get("correlation_id") == correlation_id, result
          assert result.get("capability") == capability, result
          assert result.get("proof_count", 0) >= 1, result
          assert result.get("run", {}).get("phase") == "COMPLETE", result
          assert result.get("completion_claim") == "COMPLETE_WITH_PROOF_OBSERVED", result
          observed = result.get("run", {}).get("result", {})
          assert observed.get("target_repository") == "Atlas-Ascend/Ark-OS", observed
          assert observed.get("mutation_performed") is False, observed

          proof_path = pathlib.Path("app/build/outputs/apk/debug/full-tools-command-to-proof-proof.json")
          proof_path.write_text(json.dumps({"tools": tools, "execution": result}, indent=2, sort_keys=True), encoding="utf-8")
          print("GHOST_ATLAS_FULL_TOOL_COMMAND_TO_PROOF=PASS")
          print("TOOL_COUNT=" + str(tools.get("count")))
          print("CAPABILITY=" + capability)
          print("RUN_ID=" + str(result.get("run_id")))
          print("CORRELATION_ID=" + correlation_id)
          print("PROOF_COUNT=" + str(result.get("proof_count")))
          PY

      - name: Upload APK and full-tool proof
        uses: actions/upload-artifact@v4
        with:
          name: ghost-atlas-assistant-v0.3.0-full-tools-command-to-proof
          path: |
            android/atlas-assistant/app/build/outputs/apk/debug/app-debug.apk
            android/atlas-assistant/app/build/outputs/apk/debug/full-tools-command-to-proof-proof.json
          if-no-files-found: error
