name: Atlas Android APK

on:
  push:
    branches:
      - integration/render-to-apk-atlas-assistant-001
    paths:
      - 'android/atlas-assistant/**'
      - '.github/workflows/atlas-android-apk.yml'
  pull_request:
    paths:
      - 'android/atlas-assistant/**'
      - '.github/workflows/atlas-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android/atlas-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-atlas-assistant-debug-apk
          path: android/atlas-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
